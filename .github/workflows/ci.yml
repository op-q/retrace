# Pull-request and branch validation: repository hygiene, static analysis,
# GCC/Clang builds, regular tests, and supported sanitizers.
name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast policy checks run separately so failures are easy to classify.
  repository-safety:
    name: Repository safety
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan tracked files for common secret shapes
        run: scripts/check-secrets.sh

      - name: Check whitespace
        run: git show --check --oneline --decorate HEAD

  code-quality:
    name: Formatting and static analysis
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check formatting
        run: scripts/format.sh --check

      - name: Configure compile commands
        run: cmake --preset ci

      - name: Run clang-tidy
        run: |
          mapfile -t sources < <(git ls-files '*.cpp' 'runtime/*.c')
          clang-tidy --warnings-as-errors='*' -p build/ci "${sources[@]}"

  # The same warnings-as-errors preset is compiled by both supported toolchains.
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            cc: gcc
            cxx: g++
          - name: Clang
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci

      - name: Test
        run: ctest --preset ci

  # Deliberate crash tests are excluded by CMake in sanitizer mode.
  sanitizers:
    name: ASan and UBSan
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure
        run: cmake --preset asan

      - name: Build
        run: cmake --build --preset asan

      - name: Test
        run: ctest --preset asan
